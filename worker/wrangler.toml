# 야구 게임 서버 — npx wrangler deploy
name = "baseball-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://web-interface.github.io,http://localhost:5173,http://127.0.0.1:5173"
AI_BUDGET_USD = "180"  # 조직 크레딧 $200 — 이 금액(모든 사용자 합계)에 닿으면 Claude 호출을 멈춘다
AI_DAILY_CALLS = "20"

[[d1_databases]]
binding = "DB"
database_name = "baseball"
database_id = "ebb6c16f-580d-4101-82cb-bd1c0144447b"

# 로비 채팅 — Durable Object 하나 = 방 하나. SQLite 저장소라 무료 플랜에서 된다(키-값 저장소는 유료 전용).
[[durable_objects.bindings]]
name = "CHAT"
class_name = "LobbyChat"

[[migrations]]
tag = "chat-v1"
new_sqlite_classes = ["LobbyChat"]
