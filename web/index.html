<!doctype html>
<html lang="ko" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070C16" />
    <meta name="referrer" content="no-referrer" />
    <title>야구 매니저</title>
    <script>
      // 첫 그림 전에 테마 적용 (깜빡임 방지) — 주소 ?theme= > 기기에 기억한 값 > night
      (function () {
        try {
          var ok = { night: 1, broadcast: 1, classic: 1 };
          var h = location.hash, i = h.indexOf('?');
          var t = (i >= 0 ? new URLSearchParams(h.slice(i + 1)).get('theme') : null) || new URLSearchParams(location.search).get('theme');
          if (!ok[t]) t = localStorage.getItem('bb.theme');
          if (ok[t]) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
